<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#efeee3">
  <title>클래스레볼루션</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="stage1.css">
  <link rel="stylesheet" href="growth.css">
  <link rel="stylesheet" href="restoration.css?v=20261117">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="클래스레볼루션 홈">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span class="brand-copy">클래스레볼루션</span>
      </a>
      <span class="classroom-tab">◇ 수업화면</span>
      <div class="header-actions">
        <span class="local-indicator"><i></i><span id="storage-status">로컬 저장 준비 중</span></span>
        <button class="quiet-button" id="backup-button" type="button">백업</button>
        <button class="quiet-button" id="restore-button" type="button">복원</button>
        <input id="restore-file" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="classroom-body">
      <nav class="mode-nav" aria-label="수업화면 메뉴">
        <button class="mode-tab is-active" type="button" data-mode="scoreboard" aria-label="우리반 학생"><span class="nav-icon" aria-hidden="true"><i class="art-students" aria-hidden="true"></i></span><span class="mode-label">우리반 학생</span></button>
        <button class="mode-tab" type="button" data-mode="growth" aria-label="학급점수판"><span class="nav-icon" aria-hidden="true"><i class="art-sprout" aria-hidden="true"></i></span><span class="mode-label">학급점수</span></button>
        <button class="mode-tab" type="button" data-mode="checklist" aria-label="명렬"><span class="nav-icon" aria-hidden="true"><i class="art-checklist" aria-hidden="true"></i></span><span class="mode-label">명렬</span></button>
      </nav>
      <main class="workspace">
        <section class="mode-panel is-active" id="mode-scoreboard" aria-label="점수판">
          <div id="scoreboard-root" class="module-root"></div>
        </section>
        <section class="mode-panel" id="mode-growth" aria-label="학급 성장">
          <div id="growth-root" class="module-root"></div>
        </section>
        <section class="mode-panel" id="mode-checklist" aria-label="체크리스트">
          <div id="checklist-root" class="module-root"></div>
        </section>
      </main>
    </div>
  </div>
  <div id="global-feedback" class="global-feedback" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js?v=reference-20261117"></script>
</body>
</html>
