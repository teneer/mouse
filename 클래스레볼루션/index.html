<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#efeee3">
  <title>클래스레볼루션</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="stage1.css">
  <link rel="stylesheet" href="growth.css?v=golden-eggs">
  <link rel="stylesheet" href="restoration.css?v=golden-eggs">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="shell-button" type="button" id="home-button" aria-label="학생 목록 홈" title="학생 목록 홈"><i class="art-home" aria-hidden="true"></i></button>
      <span id="class-name">우리 반</span>
      <button class="shell-button" type="button" id="header-settings" aria-label="설정" title="설정"><i class="art-settings" aria-hidden="true"></i></button>
      <div id="display-options" class="student-display-options">
        <label><input type="checkbox" data-option="numbers" checked> 번호 표시</label>
        <label><input type="checkbox" data-option="portraits"> 사진(아바타) 보기</label>
      </div>
    </header>

    <div class="classroom-body">
      <aside class="classroom-rail">
      <nav class="mode-nav" aria-label="수업 화면 메뉴">
        <button class="mode-tab" type="button" data-mode="scoreboard"><i class="art-roster" aria-hidden="true"></i><span class="mode-label">학생 목록</span></button>
        <button class="mode-tab" type="button" data-mode="seats"><i class="art-students" aria-hidden="true"></i><span class="mode-label">자리배치</span></button>
        <button class="mode-tab" type="button" data-mode="growth"><i class="art-egg" aria-hidden="true"></i><span class="mode-label">학급점수</span></button>
        <button class="mode-tab is-pending" type="button" aria-label="수업도구 · 추후 제공" title="수업도구 · 추후 제공" popovertarget="tools-notice"><i class="art-hourglass" aria-hidden="true"></i><span class="mode-label">수업도구</span></button>
        <button class="mode-tab is-pending" type="button" aria-label="전자칠판 · 추후 제공" title="전자칠판 · 추후 제공" popovertarget="board-notice"><i class="art-whiteboard" aria-hidden="true"></i><span class="mode-label">전자칠판</span></button>
        <button class="mode-tab" type="button" data-mode="checklist"><i class="art-checklist" aria-hidden="true"></i><span class="mode-label">체크리스트</span></button>
        <button class="mode-tab is-pending" type="button" aria-label="점수 일괄 관리 · 추후 제공" title="점수 일괄 관리 · 추후 제공" popovertarget="bulk-notice"><i class="art-sprout" aria-hidden="true"></i><span class="mode-label">점수 일괄 관리</span></button>
      </nav>
      <div class="rail-utilities" aria-label="수업 화면 보조 도구">
        <button class="shell-button" type="button" id="sound-toggle" aria-label="소리" title="소리" aria-pressed="true">
          <i class="art-speaker" aria-hidden="true"></i>
        </button>
        <button class="shell-button" type="button" id="curtain-toggle" aria-label="화면 가리기" title="화면 가리기" aria-pressed="false">
          <i class="art-curtain" aria-hidden="true"></i>
        </button>
        <button class="shell-button" type="button" id="rail-settings" aria-label="설정" title="설정"><i class="art-settings" aria-hidden="true"></i></button>
      </div>
      </aside>
      <div popover class="pending-notice" id="tools-notice">수업도구 · 추후 제공</div>
      <div popover class="pending-notice" id="board-notice">전자칠판 · 추후 제공</div>
      <div popover class="pending-notice" id="bulk-notice">점수 일괄 관리 · 추후 제공</div>
      <main class="workspace">
        <section class="mode-panel is-active" id="mode-scoreboard" aria-label="점수판">
          <div id="scoreboard-root" class="module-root"></div>
        </section>
        <section class="mode-panel" id="mode-growth" aria-label="학급 성장">
          <div id="growth-root" class="module-root"></div>
        </section>
        <section class="mode-panel" id="mode-checklist" aria-label="체크리스트">
          <div id="checklist-root" class="module-root"></div>
        </section>
      </main>
    </div>
  </div>
  <dialog id="app-settings" class="student-dialog" aria-labelledby="settings-title">
    <form class="student-form">
      <div class="student-dialog-title"><h2 id="settings-title">설정</h2><button type="button" id="settings-close" aria-label="닫기">×</button></div>
      <label>학반 이름<input name="className" maxlength="60" required></label>
      <p class="student-form-error" id="settings-error" role="alert"></p>
      <div class="settings-actions">
        <button class="roster-control" id="backup-button" type="button">백업</button>
        <button class="roster-control" id="restore-button" type="button">복원</button>
        <input id="restore-file" type="file" accept="application/json,.json" hidden>
      </div>
      <span id="storage-status" role="status">로컬 저장 준비 중</span>
      <button class="student-form-save" type="submit">학반 이름 저장</button>
    </form>
  </dialog>
  <div id="screen-curtain" aria-hidden="true" hidden></div>
  <div id="global-feedback" class="global-feedback" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js?v=golden-eggs"></script>
</body>
</html>
