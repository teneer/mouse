<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 점수판 v.7 · 통합 패널</title>
    <link rel="stylesheet" href="style.css?v=score-goal-manager-1">
    <link rel="stylesheet" href="../dialog.css?v=help-1">
    <link rel="stylesheet" href="celebration.css?v=motion-1">
    <link rel="stylesheet" href="pursuit-alert.css?v=pursuit-alert-1">
</head>

<body>
    <div id="score-surface">
    <div id="shared-score-banner" hidden>
        <span id="shared-score-message" role="status"></span>
        <button id="score-conflicts" type="button" hidden>점수 충돌 확인</button>
    </div>
    <button id="score-unlock-audio" type="button" hidden>소리 켜기</button>
    <div class="container">
        <div id="display-area">
            <div id="top-row">
                <section id="class-area" aria-labelledby="class-score-title">
                    <div class="main-scoreboard">
                        <header class="class-heading">
                            <div class="class-heading-main">
                                <h1 id="class-score-title">학급 점수</h1>
                                <div id="class-goal-gifts" hidden></div>
                            </div>
                            <div class="score-header-actions">
                                <button type="button" id="score-maximize" aria-label="전체 화면" title="전체 화면" aria-pressed="false"><span class="score-screen-icon" aria-hidden="true"></span></button>
                            </div>
                        </header>
                        <div class="class-score-content">
                            <div class="class-goal-slot">
                                <div id="next-class-goal" class="score-goal" role="group" aria-label="학급 목표" hidden>
                                    <strong id="next-class-goal-score" class="score-goal-value"></strong>
                                    <div id="next-class-goal-message" class="score-goal-message" hidden>
                                        <div class="goal-message-viewport">
                                            <div class="goal-message-track">
                                                <span id="goal-message-text" class="goal-message-text" role="status"></span>
                                                <span class="goal-message-repeat" aria-hidden="true"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <button id="goal-message-toggle" class="goal-motion-toggle" type="button" aria-label="학급 목표 메시지 일시 정지" hidden>Ⅱ</button>
                                </div>
                            </div>
                            <div class="main-controls">
                                <button id="main-decrease-btn" class="main-btn" aria-label="학급 점수 1점 차감">−</button>
                                <span id="number">0</span>
                                <button id="main-increase-btn" class="main-btn" aria-label="학급 점수 1점 추가">+</button>
                            </div>
                            <div id="change"></div>
                            <div class="score-progress-group">
                                <div id="score-progress" tabindex="0" role="progressbar" aria-label="학급 점수 환산 진행" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
                                    <div class="score-progress-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pursuit-slot"><button type="button" id="class-pursuit" class="pursuit-bar" aria-label="학급 추격자 편집" hidden><span class="pursuit-window"><span class="pursuit-track"><span></span><span aria-hidden="true"></span></span></span></button></div>
                </section>

            </div>

            <div id="score-region-splitter" class="score-height-splitter" role="separator" tabindex="0" aria-label="학급·모둠 영역 높이 조절" aria-orientation="horizontal" aria-controls="class-area bottom-row" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"></div>

            <section id="bottom-row" aria-labelledby="scoreboard-title">
                <button type="button" id="score-move-side" aria-label="점수판을 왼쪽으로 이동" title="점수판을 왼쪽으로 이동" hidden>&lt;</button>
                <header class="team-heading">
                    <h2 id="scoreboard-title">모둠 점수</h2>
                    <div class="team-heading-actions">
                        <span id="selected-team-count" role="status"></span>
                        <button id="team-goal-motion-toggle" class="goal-motion-toggle" type="button" aria-label="모둠 목표 메시지 일시 정지" hidden>Ⅱ</button>
                        <button id="settings-toggle-btn" type="button" aria-label="점수판 설정" aria-controls="settings-panel" aria-expanded="false"><span class="score-settings-icon" aria-hidden="true"></span></button>
                    </div>
                </header>
                <div id="team-viewport" role="region" aria-label="모둠 카드 목록" tabindex="0">
                    <div id="scoreboard" class="scoreboard"></div>
                </div>
                
                <div id="create-teams-btn-wrap">
                    <button id="create-teams-btn" type="button" class="score-secondary">＋ 모둠 추가</button>
                </div>
                <div class="pursuit-slot"><button type="button" id="team-pursuit" class="pursuit-bar" aria-label="모둠 추격자 편집" hidden><span class="pursuit-window"><span class="pursuit-track"><span></span><span aria-hidden="true"></span></span></span></button></div>
            </section>
        </div>

        <template id="team-goal-template">
            <span class="score-goal team-goal-target" role="group" aria-label="모둠 목표" hidden>
                <strong class="score-goal-value"></strong>
                <span class="score-goal-message" hidden>
                    <span class="goal-message-viewport">
                        <span class="goal-message-track">
                            <span class="goal-message-text"></span>
                            <span class="goal-message-repeat" aria-hidden="true"></span>
                        </span>
                    </span>
                </span>
            </span>
        </template>

        <div id="score-batch-splitter" class="score-height-splitter" role="separator" tabindex="0" aria-label="점수 조작 하단바 높이 조절" aria-orientation="horizontal" aria-controls="batch-score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <form id="batch-score" hidden>
            <div id="quick-undo" hidden><span id="quick-undo-label" role="status"></span><button type="button">취소</button></div>
            <div class="batch-controls">
                <button type="button" id="select-all-teams">전체선택</button>
                <button type="button" id="undo-score" disabled>되돌리기</button>
                <div class="batch-amount">
                    <input id="batch-delta" aria-label="일괄 반영할 점수" type="number" step="1" value="0" required>
                    <button type="button" id="batch-reset" aria-label="입력한 점수 지우기" hidden>×</button>
                    <div class="batch-stepper">
                        <button type="button" id="batch-up" aria-label="입력값 1 증가">+</button>
                        <button type="button" id="batch-down" aria-label="입력값 1 감소">−</button>
                    </div>
                </div>
                <button type="submit" id="apply-batch" disabled>반영</button>
            </div>
        </form>

    </div>

    </div>

    <dialog id="pursuit-editor" class="settings-panel dialog-sheet" aria-labelledby="pursuit-title">
      <header class="dialog-header"><h3 id="pursuit-title">추격자 설정</h3><button type="button" id="pursuit-close" class="dialog-close" aria-label="닫기">×</button></header>
      <div class="pursuit-settings">
        <div class="pursuit-picker" role="tablist" aria-label="추격자 설정 대상">
          <button class="dialog-action" type="button" role="tab" id="pick-class" aria-selected="true" aria-controls="class-pursuit-settings">학급</button>
          <button class="dialog-action" type="button" role="tab" id="pick-team" aria-selected="false" aria-controls="team-pursuit-settings" tabindex="-1">모둠</button>
        </div>
        <form data-kind="class" id="class-pursuit-settings" class="score-settings-section" role="tabpanel" aria-labelledby="pick-class">
          <label><input type="checkbox" name="enabled"> 추격 사용</label>
          <label>현재 추격 점수 <input name="score" type="number" min="-10000" max="10000" required></label>
          <label>패널티 메시지 <input name="message" maxlength="180" placeholder="예: 오늘 청소"></label>
          <label>추격 주기 <select name="mode"><option value="manual">수동</option><option value="daily">매일</option><option value="weekly">매주</option></select></label>
          <label>추격 요일 <select name="weekday"><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option><option value="0">일요일</option></select></label>
          <label>회차당 상승 점수 <input type="number" name="step" min="1" max="10000" required></label>
          <footer class="dialog-footer"><output name="status" role="status"></output><button class="dialog-action dialog-primary" name="save" type="submit">학급 저장</button></footer>
        </form>
        <form data-kind="team" id="team-pursuit-settings" class="score-settings-section" role="tabpanel" aria-labelledby="pick-team" hidden>
          <label><input type="checkbox" name="enabled"> 추격 사용</label>
          <label>현재 추격 점수 <input name="score" type="number" min="-10000" max="10000" required></label>
          <label>패널티 메시지 <input name="message" maxlength="180" placeholder="예: 오늘 청소"></label>
          <label>추격 주기 <select name="mode"><option value="manual">수동</option><option value="daily">매일</option><option value="weekly">매주</option></select></label>
          <label>추격 요일 <select name="weekday"><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option><option value="0">일요일</option></select></label>
          <label>회차당 상승 점수 <input type="number" name="step" min="1" max="10000" required></label>
          <footer class="dialog-footer"><output name="status" role="status"></output><button class="dialog-action dialog-primary" name="save" type="submit">모둠 저장</button></footer>
        </form>
      </div>
    </dialog>
    <dialog id="settings-panel" class="settings-panel" aria-labelledby="score-settings-title" inert>
        <header class="dialog-header"><h3 id="score-settings-title">점수판 설정</h3><button id="close-score-settings" class="dialog-close" type="button" aria-label="닫기">×</button></header>
        <section class="score-settings-section" aria-labelledby="display-settings-title">
            <h4 id="display-settings-title">화면 표시</h4>
            <div class="score-setting-row" id="score-panel-side-row" hidden>
                <span id="score-panel-side-label">점수판 위치</span>
                <button id="score-panel-side" type="button" aria-labelledby="score-panel-side-label score-panel-side">오른쪽</button>
            </div>
            <div class="score-setting-row">
                <span>학급·모둠 영역</span>
                <button type="button" id="score-reset-regions">레이아웃 초기화</button>
            </div>
            <div class="score-setting-row">
                <span id="score-layout-mode-label">모둠 카드 배치</span>
                <button id="score-layout-mode" type="button" aria-labelledby="score-layout-mode-label score-layout-mode">자동 배치</button>
            </div>
            <label class="score-setting-row" id="score-fixed-columns-row" hidden>열 수
                <input id="score-fixed-columns" type="number" min="1" max="6" step="1" value="3" inputmode="numeric">
            </label>
            <p class="score-setting-hint" id="score-layout-hint">사용 가능한 가로·세로 공간에서 모둠카드가 가장 크게 보이도록 배치합니다.</p>
            <div class="score-setting-row">
                <span id="score-card-ratio-label">모둠 카드 비율</span>
                <button id="score-card-ratio" type="button" aria-labelledby="score-card-ratio-label score-card-ratio">4:3</button>
            </div>
            <div class="score-setting-row">
                <span id="scale-label">표시 배율</span>
                <div class="score-size-controls" role="group" aria-labelledby="scale-label">
                    <button type="button" id="scoreSizeDown" aria-label="점수판 축소">−</button>
                    <output id="scoreSizeValue">100%</output>
                    <button type="button" id="scoreSizeUp" aria-label="점수판 확대">+</button>
                    <button type="button" id="scoreSizeReset" aria-label="배율을 100%로 초기화">초기화</button>
                </div>
            </div>
        </section>
        <section class="score-settings-section" aria-labelledby="link-settings-title">
            <h4 id="link-settings-title">점수 연동</h4>
            <label class="score-setting-row">모둠 점수 연동
                <input type="checkbox" id="score-link-mode" checked>
            </label>
            <label class="score-setting-row score-link-rule" id="score-link-rule">
                <span>모둠</span>
                <input id="score-link-points" type="number" min="1" step="1" value="3" aria-label="학급 1점에 필요한 모둠 점수">
                <span>점 = 학급 1점</span>
            </label>
        </section>
        <section class="score-settings-section">
            <h4>효과음</h4>
            <label class="score-setting-row">음량 <input id="score-volume" type="range" min="0" max="120" step="1" value="100"><output id="score-volume-level">100%</output></label>
            <label class="score-setting-row">음소거 <input id="score-mute" type="checkbox"></label>
        </section>
        <section class="score-settings-section" aria-labelledby="manage-settings-title">
            <h4 id="manage-settings-title">관리</h4>
            <div class="score-settings-actions">
                <button type="button" id="manage-pursuit">추격자</button><button type="button" id="open-goal-modal-btn">목표·선물 관리</button>
                <button type="button" id="open-management-modal-btn">점수판 관리</button>
            </div>
        </section>
    </dialog>

    <div id="team-setup-modal" class="modal-background" role="dialog" aria-modal="true" aria-labelledby="team-setup-title">
        <div class="modal-box">
            <header class="dialog-header"><h3 id="team-setup-title">모둠 생성</h3><button type="button" class="dialog-close" id="close-team-setup" aria-label="닫기">×</button></header>
            <div class="modal-content">
                <label for="team-count">모둠 수:</label>
                <input type="number" id="team-count" min="1" max="12" value="6">
            </div>
            <div class="modal-footer">
                <button id="cancel-team-setup" class="dialog-action">취소</button>
                <button id="confirm-team-setup" class="dialog-action dialog-primary">확인</button>
            </div>
        </div>
    </div>

    <div id="management-modal" class="fullscreen-view" role="dialog" aria-modal="true" aria-labelledby="manage-title">
      <div class="dialog-sheet">
        <header class="dialog-header">
            <h2 id="manage-title">점수판 관리</h2>
            <button id="close-management-dialog" class="dialog-close" aria-label="닫기">×</button>
        </header>
        <div class="management-content">
             <div class="setting-item" style="margin-bottom:20px;">
                <label for="manage-main-score">학급 점수</label>
                <input type="number" id="manage-main-score">
            </div>
             
             <div class="setting-item">
                <h3>모둠 점수</h3>
                <div id="team-management-list"></div>
                <button id="add-team-btn" class="add-row-btn">+ 모둠 추가</button>
            </div>

            <section class="score-management-reset" aria-label="점수 초기화">
                <button type="button" id="reset-main-btn">학급 점수 초기화</button>
                <button type="button" id="reset-teams-btn">모둠 점수 초기화</button>
            </section>

            <div class="management-footer">
                <button id="close-management-btn" class="dialog-action">취소</button>
                <button id="save-management-btn" class="dialog-action dialog-primary">저장</button>
            </div>
        </div>
      </div>
    </div>

    <div id="goal-management-view" class="fullscreen-view" role="dialog" aria-modal="true" aria-labelledby="goal-manage-title">
      <div class="dialog-sheet">
        <header class="dialog-header"><h2 id="goal-manage-title">목표·선물 관리</h2><button id="cancel-goal-view" class="dialog-close" aria-label="닫기">×</button></header>
        <div id="goal-settings">
          <aside class="goal-navigation" aria-label="목표 목록">
            <div class="goal-switch" role="group" aria-label="목표 대상">
              <button type="button" class="dialog-action" data-goal-scope="class" aria-pressed="true">학급</button>
              <button type="button" class="dialog-action" data-goal-scope="team" aria-pressed="false">모둠</button>
            </div>
            <div id="goal-nav-list"></div>
            <button type="button" class="dialog-action" id="goal-add-selected">＋ 목표 추가</button>
          </aside>
          <div class="goal-detail" data-mode="settings">
            <div class="goal-switch goal-detail-switch" role="group" aria-label="목표 관리 화면">
              <button type="button" class="dialog-action" data-goal-mode="settings" aria-pressed="true">목표 설정</button>
              <button type="button" class="dialog-action" data-goal-mode="rewards" aria-pressed="false">선물 지급</button>
            </div>
            <p id="goal-empty">목표를 추가하면 설정과 지급 현황이 여기에 표시됩니다.</p>
            <div id="class-goals-list"></div>
            <div id="team-goals-list"></div>
          </div>
        </div>
        <div class="goal-manager-footer">
          <p id="goal-edit-error" role="status"></p>
          <label><input type="checkbox" id="goal-include-existing"> 이미 도달한 대상의 기록도 만들기</label>
          <div class="dialog-footer"><button class="dialog-action" id="cancel-goal-edit">닫기</button><button class="dialog-action dialog-primary" id="close-goal-view-btn">목표 저장</button></div>
        </div>
      </div>
    </div>

    <aside id="goal-celebration" hidden aria-label="축하 메시지"></aside>

    <dialog class="score-delete-dialog" id="team-delete-dialog" aria-labelledby="team-delete-title">
        <form method="dialog">
            <header class="dialog-header"><h2 id="team-delete-title">모둠 삭제</h2><button class="dialog-close" value="cancel" aria-label="닫기">×</button></header>
            <p id="team-delete-message"></p>
            <div class="dialog-footer"><button class="dialog-action" value="cancel" autofocus>취소</button><button class="dialog-action dialog-danger" value="delete">삭제</button></div>
        </form>
    </dialog>
    <dialog class="score-delete-dialog" id="score-conflict-dialog" aria-labelledby="score-conflict-title">
        <form method="dialog">
            <header class="dialog-header"><h2 id="score-conflict-title">점수 충돌 확인</h2><button class="dialog-close" aria-label="닫기">×</button></header>
            <p>서버 값과 기기에서 마지막으로 입력한 값 중 적용할 점수를 고르세요.</p>
            <div id="score-conflict-fields"></div>
        </form>
    </dialog>

    <script type="module" src="script.js?v=score-goal-manager-1"></script><script type="module" src="panel-ui.js?v=score-batch-rows-1"></script>
</body>
</html>
